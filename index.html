
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảnh Đẹp Thế Giới</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CẢNH ĐẸP THẾ GIỚI</h1>
        <p>Khám phá những vùng đất tuyệt đẹp và kỳ quan trên hành tinh.</p>
    </header>

    <main>
        <div class="grid">

            <figure>
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80"
                     alt="Những dãy núi cao hùng vĩ phủ tuyết trắng">
                <figcaption>
                    <h2>Núi non hùng vĩ</h2>
                    <p>Những đỉnh núi cao tạo nên khung cảnh thiên nhiên ngoạn mục.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=900&q=80"
                     alt="Những ngôi nhà nhiều màu sắc bên bờ biển nước Ý">
                <figcaption>
                    <h2>Vẻ đẹp nước Ý</h2>
                    <p>Ngôi làng ven biển đầy màu sắc mang nét đẹp thơ mộng.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=900&q=80"
                     alt="Con phố cổ với kiến trúc truyền thống tại Nhật Bản">
                <figcaption>
                    <h2>Nhật Bản thanh bình</h2>
                    <p>Kiến trúc truyền thống hòa quyện cùng vẻ đẹp văn hóa Á Đông.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80"
                     alt="Bãi biển xanh trong với cát trắng và những con sóng nhẹ">
                <figcaption>
                    <h2>Thiên đường biển</h2>
                    <p>Làn nước xanh và bờ cát trắng mang đến cảm giác thư thái.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
                     alt="Thung lũng xanh rộng lớn giữa núi non và thiên nhiên">
                <figcaption>
                    <h2>Thung lũng xanh</h2>
                    <p>Không gian trong lành với những cánh đồng và núi đồi bất tận.</p>
                </figcaption>
            </figure>

            <figure>
                <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80"
                     alt="Đường phố thành phố lớn rực sáng dưới ánh đèn ban đêm">
                <figcaption>
                    <h2>Thành phố về đêm</h2>
                    <p>Những ánh đèn rực rỡ tạo nên vẻ đẹp hiện đại và sống động.</p>
                </figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>Cảnh đẹp thế giới – Mỗi hành trình là một trải nghiệm đáng nhớ.</p>
    </footer>

</body>
</html>
